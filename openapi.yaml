openapi: 3.0.3
info:
  title: MS Competency API
  description: >
    Microsserviço de Competências do sistema Chave — Sistema de Autoavaliação
    de Competências para Pessoas Idosas. Responsável pelo catálogo de
    competências, subcompetências e suas faixas de nível (levels) usadas na
    autoavaliação.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Ambiente local
  - url: https://api.chave.example/competency
    description: Via AWS API Gateway

tags:
  - name: Competencies
    description: Catálogo de competências
  - name: Competency Levels
    description: Faixas de nível de uma competência (por score)
  - name: Sub Competencies
    description: Subcompetências pertencentes a uma competência
  - name: Sub Competency Levels
    description: Faixas de nível de uma subcompetência (por score)

paths:
  # ----------------------------------------------------------------------- #
  # Competency
  # ----------------------------------------------------------------------- #
  /competencies:
    get:
      tags: [Competencies]
      summary: Lista competências
      operationId: listCompetencies
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Lista de competências
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Competency'
    post:
      tags: [Competencies]
      summary: Cria uma competência
      operationId: createCompetency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompetencyInput'
      responses:
        '201':
          description: Competência criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Competency'
        '400':
          $ref: '#/components/responses/BadRequest'

  /competencies/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Competencies]
      summary: Busca competência por id
      operationId: getCompetency
      responses:
        '200':
          description: Competência encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Competency'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Competencies]
      summary: Atualiza competência
      operationId: updateCompetency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompetencyInput'
      responses:
        '200':
          description: Competência atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Competency'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Competencies]
      summary: Remove competência
      operationId: deleteCompetency
      responses:
        '204':
          description: Removida
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------------- #
  # Competency Levels (filhos de Competency)
  # ----------------------------------------------------------------------- #
  /competencies/{competencyId}/levels:
    parameters:
      - $ref: '#/components/parameters/CompetencyId'
    get:
      tags: [Competency Levels]
      summary: Lista os níveis de uma competência
      operationId: listCompetencyLevels
      responses:
        '200':
          description: Lista de níveis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompetencyLevel'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Competency Levels]
      summary: Cria um nível para a competência
      operationId: createCompetencyLevel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompetencyLevelInput'
      responses:
        '201':
          description: Nível criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetencyLevel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /competency-levels/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Competency Levels]
      summary: Busca nível de competência por id
      operationId: getCompetencyLevel
      responses:
        '200':
          description: Nível encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetencyLevel'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Competency Levels]
      summary: Atualiza nível de competência
      operationId: updateCompetencyLevel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompetencyLevelInput'
      responses:
        '200':
          description: Nível atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetencyLevel'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Competency Levels]
      summary: Remove nível de competência
      operationId: deleteCompetencyLevel
      responses:
        '204':
          description: Removido
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------------- #
  # Sub Competency (filhos de Competency)
  # ----------------------------------------------------------------------- #
  /competencies/{competencyId}/sub-competencies:
    parameters:
      - $ref: '#/components/parameters/CompetencyId'
    get:
      tags: [Sub Competencies]
      summary: Lista subcompetências de uma competência
      operationId: listSubCompetencies
      responses:
        '200':
          description: Lista de subcompetências
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubCompetency'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Sub Competencies]
      summary: Cria subcompetência na competência
      operationId: createSubCompetency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubCompetencyInput'
      responses:
        '201':
          description: Subcompetência criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubCompetency'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /sub-competencies/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Sub Competencies]
      summary: Busca subcompetência por id
      operationId: getSubCompetency
      responses:
        '200':
          description: Subcompetência encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubCompetency'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Sub Competencies]
      summary: Atualiza subcompetência
      operationId: updateSubCompetency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubCompetencyInput'
      responses:
        '200':
          description: Subcompetência atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubCompetency'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Sub Competencies]
      summary: Remove subcompetência
      operationId: deleteSubCompetency
      responses:
        '204':
          description: Removida
        '404':
          $ref: '#/components/responses/NotFound'

  # ----------------------------------------------------------------------- #
  # Sub Competency Levels (filhos de SubCompetency)
  # ----------------------------------------------------------------------- #
  /sub-competencies/{subCompetencyId}/levels:
    parameters:
      - $ref: '#/components/parameters/SubCompetencyId'
    get:
      tags: [Sub Competency Levels]
      summary: Lista níveis de uma subcompetência
      operationId: listSubCompetencyLevels
      responses:
        '200':
          description: Lista de níveis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubCompetencyLevel'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Sub Competency Levels]
      summary: Cria nível para a subcompetência
      operationId: createSubCompetencyLevel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubCompetencyLevelInput'
      responses:
        '201':
          description: Nível criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubCompetencyLevel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /sub-competency-levels/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Sub Competency Levels]
      summary: Busca nível de subcompetência por id
      operationId: getSubCompetencyLevel
      responses:
        '200':
          description: Nível encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubCompetencyLevel'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Sub Competency Levels]
      summary: Atualiza nível de subcompetência
      operationId: updateSubCompetencyLevel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubCompetencyLevelInput'
      responses:
        '200':
          description: Nível atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubCompetencyLevel'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Sub Competency Levels]
      summary: Remove nível de subcompetência
      operationId: deleteSubCompetencyLevel
      responses:
        '204':
          description: Removido
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CompetencyId:
      name: competencyId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SubCompetencyId:
      name: subCompetencyId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Competency:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
        description:
          type: string
      required: [id, name]

    CompetencyInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
      required: [name]

    SubCompetency:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        competencyId:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
      required: [id, competencyId, name]

    SubCompetencyInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
      required: [name]

    CompetencyLevel:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        competencyId:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        lowerScore:
          type: number
          format: double
        upperScore:
          type: number
          format: double
        orderIndex:
          type: integer
      required: [id, competencyId, name, lowerScore, upperScore, orderIndex]

    CompetencyLevelInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        lowerScore:
          type: number
          format: double
        upperScore:
          type: number
          format: double
        orderIndex:
          type: integer
      required: [name, lowerScore, upperScore, orderIndex]

    SubCompetencyLevel:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        subCompetencyId:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        lowerScore:
          type: number
          format: double
        upperScore:
          type: number
          format: double
        orderIndex:
          type: integer
      required: [id, subCompetencyId, name, lowerScore, upperScore, orderIndex]

    SubCompetencyLevelInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        lowerScore:
          type: number
          format: double
        upperScore:
          type: number
          format: double
        orderIndex:
          type: integer
      required: [name, lowerScore, upperScore, orderIndex]

    Error:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
      required: [status, message]
